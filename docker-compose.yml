version: "3.8"
services:
  web:
    build: .
    image: vrepair-website:latest
    ports:
      - "8081:80"
    restart: unless-stopped
  email-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: vrepair-website-api:latest
    ports:
      - "3001:3001"
    restart: unless-stopped
    environment:
      - PORT=3001
    env_file:
      - .env
