server {
    listen       80;
    server_name  _;

    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/index.html =404;
    }

    location ^~ /api/ {
        # Proxy API requests to the API container using Docker DNS resolver at runtime
        resolver 127.0.0.11 valid=30s;
        set $upstream "email-api:3001";
        # forward the full original request URI so paths like /api/send-email are preserved
        proxy_pass http://$upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    error_page  404              /__spa-fallback.html;
}
